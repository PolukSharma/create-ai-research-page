<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="title desc">
  <title id="title">Interconnected critical infrastructure sectors</title>
  <desc id="desc">Electric power at the center linked to transportation, water, communications, ports, and supply chains.</desc>
  <g fill="none" stroke="#c4b8b0" stroke-width="1.5">
    <line x1="360" y1="160" x2="160" y2="70"/>
    <line x1="360" y1="160" x2="560" y2="70"/>
    <line x1="360" y1="160" x2="120" y2="220"/>
    <line x1="360" y1="160" x2="600" y2="220"/>
    <line x1="360" y1="160" x2="360" y2="280"/>
    <line x1="160" y1="70" x2="560" y2="70" opacity="0.45"/>
    <line x1="120" y1="220" x2="360" y2="280" opacity="0.45"/>
    <line x1="600" y1="220" x2="360" y2="280" opacity="0.45"/>
  </g>
  <circle cx="360" cy="160" r="52" fill="#990000"/>
  <text x="360" y="154" text-anchor="middle" fill="#fff" font-family="Georgia, serif" font-size="13" font-weight="700">Electric</text>
  <text x="360" y="172" text-anchor="middle" fill="#fff" font-family="Georgia, serif" font-size="13" font-weight="700">Power</text>
  <rect x="88" y="42" width="144" height="56" rx="4" fill="#efeae6" stroke="#990000" stroke-width="1.5"/>
  <text x="160" y="75" text-anchor="middle" fill="#1a1a1a" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700">Transportation</text>
  <rect x="488" y="42" width="144" height="56" rx="4" fill="#efeae6" stroke="#990000" stroke-width="1.5"/>
  <text x="560" y="75" text-anchor="middle" fill="#1a1a1a" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700">Communications</text>
  <rect x="48" y="192" width="144" height="56" rx="4" fill="#efeae6" stroke="#990000" stroke-width="1.5"/>
  <text x="120" y="225" text-anchor="middle" fill="#1a1a1a" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700">Water</text>
  <rect x="528" y="192" width="144" height="56" rx="4" fill="#efeae6" stroke="#990000" stroke-width="1.5"/>
  <text x="600" y="225" text-anchor="middle" fill="#1a1a1a" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700">Ports</text>
  <rect x="288" y="252" width="144" height="56" rx="4" fill="#efeae6" stroke="#990000" stroke-width="1.5"/>
  <text x="360" y="285" text-anchor="middle" fill="#1a1a1a" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700">Supply Chains</text>
</svg>
